<html>
  <head>
    <title>수강 신청 사이트</title>
  </head>
  <body>
    <form>
      <h1>수강 신청 사이트</h1>

      <label for="name">이름</label>
      <input type="text" id="name" name="name" required>

      <label for="email">이메일</label>
      <input type="email" id="email" name="email" required>

      <label for="grade">학년</label>
      <select id="grade" name="grade">
        <option value="1">1학년</option>
        <option value="2">2힉냔</option>
      </select>

      <fieldset>
        <legend>수강 신청 가능 목록</legend>
        <label><input type="radio" name="field" value="front">프론트엔드</label>
        <label><input type="radio" name="field" value="back">백엔드</label>
        <label><input type="radio" name="field" value="AI">AI</label>
      </fieldset>
    </form>
  </body>
</html>
